# The router's DNS for LAN hosts (`management = ["dns"]` on an inside
# interface): the data plane hands their queries to this address, on the
# host path (eph-host), and the answers back out. It's link-local and only
# reachable that way; resolved binds it even before eph-host exists.
[Resolve]
DNSStubListenerExtra=169.254.255.253
