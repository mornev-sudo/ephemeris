# The journal (ephemerisd's log at info and above, and everything else on
# the system) lives on /var. Cap it so that no amount of logging can fill
# the data partition: the oldest entries go first, and nothing is kept
# longer than 90 days. (ephemerisd's debug.log and audit.log, in
# /var/log/ephemeris, have their own caps: 64 MiB and 16 MiB by default.)
[Journal]
SystemMaxUse=256M
MaxRetentionSec=90day
SystemKeepFree=512M
SystemMaxFileSize=32M
RuntimeMaxUse=64M
