# A hung router resets itself: systemd keeps the hardware watchdog (if the
# machine has one: on Proxmox, the i6300esb device deploy-image.sh adds)
# from firing while it's alive. A hang during a trial boot then uses up a
# try, and the boot loader falls back. Without a watchdog device this does
# nothing.
[Manager]
RuntimeWatchdogSec=30s
# A shutdown or reboot that hangs is forced after this long.
RebootWatchdogSec=2min
