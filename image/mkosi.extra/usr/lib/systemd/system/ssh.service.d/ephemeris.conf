[Unit]
Wants=ephemeris-ssh-keygen.service
After=ephemeris-ssh-keygen.service

[Service]
# The policy from [ssh] (keys only?), so sshd starts with it. If the config
# can't be read, sshd starts without it and ephemerisd writes it later.
ExecStartPre=-/usr/bin/ephemerisd --ssh-policy --config /var/lib/ephemeris/ephemeris.toml
