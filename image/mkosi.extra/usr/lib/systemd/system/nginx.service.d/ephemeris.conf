# HTTPS front end for the management portal (see /etc/nginx/nginx.conf).
[Unit]
Wants=ephemeris-tls-cert.service
After=ephemeris-tls-cert.service

[Service]
NoNewPrivileges=yes
ProtectHome=yes
PrivateTmp=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
Restart=on-failure
