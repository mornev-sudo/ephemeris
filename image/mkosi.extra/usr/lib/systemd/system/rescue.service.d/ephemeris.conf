# A router has nobody at its console. Instead of waiting forever for a root
# login (which is disabled anyway), reboot. With boot counting that means:
# try the new version again, and after three failures fall back to the
# previous one, all without anyone touching the router.
[Service]
ExecStartPre=
ExecStart=
ExecStart=/bin/sh -c 'echo "Ephemeris: boot failed, rebooting in 30 s" >/dev/console; sleep 30; systemctl reboot --force'
