# Per-router state in /var, seeded from systemd credentials. The Proxmox
# deploy script passes credentials to the VM through SMBIOS (qm --args).
#
# Type  Path                                       Mode User Group Age Argument
d       /var/lib/ephemeris                           0755 root root  -   -
d       /var/lib/ephemeris/ssh                       0700 root root  -   -
# Rewritten every boot, so changing the key in Proxmox takes effect on reboot.
f+^     /var/lib/ephemeris/ssh/authorized_keys.root  0600 root root  -   ssh.authorized_keys.root
# Written only if missing: after first boot the router owns its config.
# Private: it can hold SD-WAN tether keys.
f^      /var/lib/ephemeris/ephemeris.toml              0600 root root  -   ephemeris.config
z       /var/lib/ephemeris/ephemeris.toml              0600 root root  -   -
# TLS certificate and key for the HTTPS portal (ephemeris-tls-cert.service).
d       /var/lib/ephemeris/tls                       0700 root root  -   -
# nginx's state: present in a fresh image, but /var survives updates, so a
# router updated from a version without nginx needs it created.
d       /var/lib/nginx                             0755 www-data www-data - -
d       /var/log/nginx                             0750 www-data adm   -   -
