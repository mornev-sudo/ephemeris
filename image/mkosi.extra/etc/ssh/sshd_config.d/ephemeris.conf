# /etc is read-only and identical on every router, so per-router secrets live
# in /var: host keys are generated on first boot, authorized keys come from
# the "ssh.authorized_keys.root" credential (see /usr/lib/tmpfiles.d/ephemeris.conf).
HostKey /var/lib/ephemeris/ssh/ssh_host_ed25519_key
AuthorizedKeysFile .ssh/authorized_keys /var/lib/ephemeris/ssh/authorized_keys.%u
# Key or password (the admin password generated on first boot). A router
# deployed without an SSH key must still be reachable.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
# Against password guessing: few tries per connection, a short grace time,
# and few unauthenticated connections at once. (OpenSSH 9.8+ also penalises
# addresses that keep failing: PerSourcePenalties, on by default.)
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 4:50:16
