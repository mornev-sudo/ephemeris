# Ephemeris: nginx only terminates HTTPS for the management portal and API,
# and hands every request to ephemerisd, which listens on loopback only
# (management.listen = 127.0.0.1:8080). Nothing else is served.
#
# The certificate is self-signed, generated on first boot by
# ephemeris-tls-cert.service (its SHA-256 fingerprint is shown on the console).
# To use your own, replace /var/lib/ephemeris/tls/{cert,key}.pem and run
# `systemctl reload nginx`.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
# To the journal (nginx runs under systemd).
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    # ephemerisd writes its own audit log of logins and changes.
    access_log off;

    client_body_temp_path /var/lib/nginx/body;
    proxy_temp_path /var/lib/nginx/proxy;

    # A configuration is at most 256 KiB; ephemerisd refuses more anyway.
    client_max_body_size 512k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Password guessing: at most 10 login attempts a minute per address
    # (ephemerisd also locks an address out after 5 wrong passwords).
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;

        ssl_certificate /var/lib/ephemeris/tls/cert.pem;
        ssl_certificate_key /var/lib/ephemeris/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;
        ssl_session_cache shared:tls:1m;
        ssl_session_timeout 1h;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # ephemerisd checks the Host (DNS rebinding) and Origin itself, and
        # believes these two headers only from loopback, i.e. from here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Long enough for an update check (ephemerisd cuts off at 300 s).
        proxy_read_timeout 310s;

        location = /api/v1/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://127.0.0.1:8080;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
        }
    }
}
