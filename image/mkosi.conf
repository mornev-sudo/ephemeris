# Ephemeris OS: an immutable Debian image with ephemerisd preinstalled.
#
# Build with image/build.sh (Linux only). See docs/learn/08-immutable-image.md
# for what every setting here is for.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=ephemeris
OutputDirectory=mkosi.output
# ephemeris_<version>_x86-64.raw, plus the pieces an update needs, as separate
# files: the root and root-verity partitions and the UKI (see mkosi.repart/
# and /usr/lib/sysupdate.d/). Named the way systemd-sysupdate expects.
Output=%i_%v_%a
SplitArtifacts=uki,partitions
# Every package in the image, with its version (<output>.manifest): the
# Debian half of the release's SBOM.
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
# Versioned UKI name; updates add a boot counter: ephemeris_<v>_x86-64+3-0.efi
UnifiedKernelImageFormat=%i_%v_%a
# Serial console last, so it becomes /dev/console (Proxmox "serial0", and
# what CI reads). The machine ID comes from the VM's SMBIOS UUID: the root
# filesystem is read-only, so it can't be generated and stored on disk.
KernelCommandLine=console=tty0 console=ttyS0,115200 systemd.machine_id=firmware
WithDocs=no
CleanPackageMetadata=yes
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-repart
        systemd-container
        gpg
        openssl
        systemd-timesyncd
        udev
        dbus
        kmod
        linux-image-amd64
        openssh-server
        nginx
        qemu-guest-agent
        iproute2
        ethtool
        iputils-ping
        tcpdump
        bpftool
        procps
        less
        ca-certificates

[Validation]
# Sign systemd-boot and every UKI. The key comes from the SECUREBOOT_KEY
# GitHub secret (written to mkosi.key by CI); the certificate is public.
# On first boot, systemd-boot enrolls this certificate into the VM's UEFI
# firmware (it starts in "setup mode") and from then on the firmware only
# boots binaries signed with our key.
SecureBoot=yes
SecureBootKey=mkosi.key
SecureBootCertificate=mkosi.crt
SecureBootAutoEnroll=yes

[Build]
# mkosi fetches a pinned set of build tools (repart, ukify, mkfs.erofs,
# veritysetup...) instead of relying on whatever the build host has.
ToolsTree=yes
