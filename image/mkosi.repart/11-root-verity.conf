# dm-verity hash tree for the root partition. Its top hash ("root hash") is
# baked into the kernel command line inside the UKI; if a single byte of root
# changes, reading it fails. Each UKI therefore boots exactly one root slot.
[Partition]
Type=root-verity
Label=%M_%A_verity
Verity=hash
VerityMatchKey=root
SizeMinBytes=64M
SizeMaxBytes=64M
SplitName=%t.%U
