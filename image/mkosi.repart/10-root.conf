# The operating system, slot A: read-only erofs, everything except /var and
# /efi. Verity=data: every block is covered by the hash tree in 11-root-verity.
#
# Fixed size, because updates are written into the *other* slot and then this
# one in turn: every future version has to fit. The label carries the version
# (ephemeris_<version>), which is how systemd-sysupdate tells slots apart.
[Partition]
Type=root
Label=%M_%A
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/efi/
Verity=data
VerityMatchKey=root
SizeMinBytes=1536M
SizeMaxBytes=1536M
SplitName=%t.%U
