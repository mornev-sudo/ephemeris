# Writable state: router config, SSH host keys, logs. Survives image updates.
# Grown to fill the disk on first boot: systemd-repart grows the partition
# (/usr/lib/repart.d/), ephemeris-grow-var.service the filesystem.
[Partition]
Type=linux-generic
Label=var
Format=ext4
CopyFiles=/var:/
SizeMinBytes=2G
SplitName=-
