# EFI System Partition: the firmware reads this. Holds systemd-boot and the
# unified kernel images (kernel + initrd + command line + root hash in one
# file), one per installed version.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
SplitName=-
