# Dependency policy, checked in CI (`cargo deny check`): known vulnerabilities
# (the RustSec advisory database), licences, and where crates come from.
# OWASP DevSecOps: software composition analysis.

[graph]
all-features = true

[advisories]
# Any vulnerability or unsound-code advisory fails the build; so does a
# yanked crate. An exception goes in `ignore`, with the reason next to it.
version = 2
yanked = "deny"
ignore = []

[licenses]
# Permissive licences, compatible with Ephemeris' MIT OR Apache-2.0.
# Anything else (copyleft, unknown) fails until it's looked at.
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    # Permissive, like MIT: ring, rustls-webpki and untrusted (the TLS to
    # a controller) use it.
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
# Two versions of one crate: reported, not fatal (it's common while the
# ecosystem moves). Version wildcards: refused (except our own path deps).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only: no unknown registries, no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
