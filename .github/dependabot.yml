# Monthly pull requests for dependency updates (OWASP DevSecOps: dependency
# management), at most three open at once. Security fixes come as soon as an
# advisory is published, whatever the schedule. CI (cargo-deny, tests, the
# boot test) checks every one before it can be merged.
#
# Open pull requests aren't rebased each time main changes (every rebase is a
# full CI run). Comment "@dependabot rebase" on one before merging it.
#
# fuzz/ has no entry: its dependencies come from the workspace crates, apart
# from libfuzzer-sys, and follow the workspace's updates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    groups:
      # Patch and minor updates together in one PR; majors one by one.
      rust-minor:
        update-types: [minor, patch]
    # A few days' delay before taking a new release: most malicious or
    # broken versions are caught and yanked within that time.
    cooldown:
      default-days: 5

  # The Actions in .github/workflows, pinned to commits: Dependabot moves
  # the pin and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
