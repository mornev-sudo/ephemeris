# Publish a release: build the tagged commit's image with the real signing
# keys, test it in full (the same "image" workflow pull requests run: unit
# tests, fuzzing, the SD-WAN lab, then the image's boot and end-to-end test),
# and publish exactly the image that passed.
#
#   (bump the version in Cargo.toml and add docs/releases/vX.Y.Z.md on main)
#   git tag -a vX.Y.Z <commit> -m "Ephemeris vX.Y.Z: ..." && git push origin vX.Y.Z
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Before anything is built: the tag must name the release in Cargo.toml,
  # and its notes must be there.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, version and notes
        run: |
          release=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "v$release" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml's version ($release). Set version = \"${GITHUB_REF_NAME#v}\" in Cargo.toml, push, then tag that commit."
            exit 1
          fi
          test -s "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "::error::no release notes: add docs/releases/$GITHUB_REF_NAME.md, push, then tag that commit."
            exit 1
          }

  image:
    needs: check
    uses: ./.github/workflows/image.yml
    with:
      release: true
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      actions: read   # download this run's image
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the tested image
        run: gh run download "$GITHUB_RUN_ID" -n ephemeris-image -D dist

      - name: Verify and publish
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          # The image must be the release the tag names, built from this
          # commit: v0.5.0 only for build 0.5.0-<this commit>.
          build=$(cat VERSION)
          rel=${GITHUB_REF_NAME#v}
          if [[ $build != "$rel-${GITHUB_SHA::7}" ]]; then
            echo "::error::the image is build $build, not $rel-${GITHUB_SHA::7}"
            exit 1
          fi
          test -s SHA256SUMS.gpg || { echo "::error::the build produced no SHA256SUMS.gpg"; exit 1; }
          # The release notes live in the repo, written with the release
          # commit; the build line and GitHub's list of PRs go under them.
          notes="$(cat "../docs/releases/$GITHUB_REF_NAME.md")

          ---

          Image build \`$build\` (commit ${GITHUB_SHA::8}), signed and boot-tested in [run $GITHUB_RUN_ID](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
          # The qcow2 is for new routers; the .raw.xz and .efi files are what
          # existing routers download to update themselves (systemd-sysupdate).
          gh release create "$GITHUB_REF_NAME" --title "Ephemeris $GITHUB_REF_NAME" \
            --notes "$notes" --generate-notes \
            *.qcow2 *.raw.xz *.efi SHA256SUMS SHA256SUMS.gpg VERSION *.manifest *.cdx.json
