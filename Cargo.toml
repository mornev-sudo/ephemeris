[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# The release version: the one place it is set. CI builds images named
# <this>-<commit>, and a release tag must be v<this> (release.yml).
version = "0.12.3"
edition = "2021"
license = "MIT OR Apache-2.0"
# Built into the router image, never published to crates.io.
publish = false
rust-version = "1.88"

[workspace.dependencies]
eph-packet = { path = "crates/eph-packet" }
eph-fib = { path = "crates/eph-fib" }
eph-dataplane = { path = "crates/eph-dataplane" }
eph-xdp = { path = "crates/eph-xdp" }
eph-config = { path = "crates/eph-config" }
libc = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", features = ["preserve_order"] }  # keep struct field order when the GUI rewrites a section
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25"
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "2", default-features = false }
# Overlay encryption (RustCrypto, pure Rust). No default features: no
# allocation or OS randomness is needed for sealing packets in place.
chacha20poly1305 = { version = "0.11", default-features = false }
# AES-256-GCM for tethers between routers that both have AES in hardware
# (AES-NI and PCLMULQDQ, or ARMv8 crypto): chosen in the handshake. Found
# at run time; a constant-time software version otherwise.
aes-gcm = { version = "0.11", default-features = false, features = ["aes"] }
# SD-WAN handshakes: the Noise protocol framework (Noise_IKpsk2, the
# pattern WireGuard uses), with only the primitives that pattern needs. Not
# its "std" feature: that also pulls in ring, which we don't use.
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom", "risky-raw-split"] }
# This router's SD-WAN public key, from its private key (snow uses it too).
curve25519-dalek = { version = "4.1", default-features = false }
# The router's identity towards a controller (docs/controller-api.md): an
# Ed25519 key pair, the same curve library as the SD-WAN key above.
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }
# Randomness for new keys, from the OS (snow uses the same crate).
getrandom = "0.3"
# The connection to a controller (docs/controller-api.md): TLS 1.3 with
# rustls on ring (not aws-lc, which needs a C toolchain and cmake), a
# WebSocket over it, and the router's self-signed client certificate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
# The handshake's mac1 (a keyed BLAKE2s, as in WireGuard).
blake2 = { version = "0.10", default-features = false }
# CHAP-MD5 for PPPoE logins (RFC 1994 mandates MD5; nothing else uses it).
md-5 = { version = "0.11", default-features = false }

# Rules for `unsafe`, checked on every build (and by clippy in CI): every
# unsafe block and impl says why it's sound in a `// SAFETY:` comment, every
# unsafe fn says what its callers must guarantee (`# Safety`), and unsafe
# operations inside an unsafe fn still need their own block. Crates that
# don't need unsafe at all forbid it outright (#![forbid(unsafe_code)]).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

# The data plane lives or dies by inlining and branch layout, so even
# dev builds get some optimisation, and release builds get LTO.
[profile.dev]
opt-level = 1

# Optimised like release, but quick to build (no whole-program LTO): for
# tests that measure throughput outside the image (lab/netns, CI).
[profile.lab]
inherits = "release"
lto = false
codegen-units = 16
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
