[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# The release version: the one place it is set. CI builds images named
# <this>-<commit>, and a release tag must be v<this> (release.yml).
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
eph-packet = { path = "crates/eph-packet" }
eph-fib = { path = "crates/eph-fib" }
eph-dataplane = { path = "crates/eph-dataplane" }
eph-xdp = { path = "crates/eph-xdp" }
libc = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", features = ["preserve_order"] }  # keep struct field order when the GUI rewrites a section
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25"
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "2", default-features = false }
# Overlay encryption (RustCrypto, pure Rust). No default features: no
# allocation or OS randomness is needed for sealing packets in place.
chacha20poly1305 = { version = "0.10", default-features = false }
# CHAP-MD5 for PPPoE logins (RFC 1994 mandates MD5; nothing else uses it).
md-5 = { version = "0.10", default-features = false }

# The data plane lives or dies by inlining and branch layout, so even
# dev builds get some optimisation, and release builds get LTO.
[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
